# bOrca CI (spec item P0.4, architecture decision AD-21).
#
# Runs for spec/borca-fixes, the working branch, and for main, bOrca's
# release line from v1.0.0, which moves only at tagged releases; and for v*
# tags. The JS Orca that main held before v1.0.0 lives on the js-orca branch.
# Start a manual run with `gh workflow run ci.yml --ref <branch>`.
#
# The build and unsigned-char jobs run the same ./tool, tests/run.sh,
# build/unit_tests and tests/check-*.sh commands a developer runs locally
# (tests/README.md lists them for the uConsole). Three kinds of step need
# what the uConsole lacks: the --portmidi builds need libportmidi-dev, the
# armhf job, which runs the unit tests at a 32-bit Usz under qemu, needs the
# armhf cross compiler, and the clang job needs clang,
# whose UBSan reports NULL + 0 where gcc's does not. The --alsa builds need
# libasound2-dev, which the uConsole has. The runners' gcc can also differ
# from the device's; each job's "Toolchain versions" step prints it.
name: CI

on:
  push:
    branches: [spec/borca-fixes, main]
    tags: ['v*']
  pull_request:
    branches: [spec/borca-fixes, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull-request runs only: every pushed head of the branch
  # keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # A red x86_64 leg must not cancel the arm64 result, or the reverse.
      fail-fast: false
      matrix:
        # Pinned images, never -latest. ubuntu-24.04-arm is the closest hosted
        # match to the CM5 (aarch64, unsigned char), but it runs 4 KB pages and
        # glibc 2.39 where the uConsole runs 16 KB pages and glibc 2.36, and it
        # builds the --alsa and appliance binaries against gcc 13.3 and
        # libasound 1.2.11 (the device has gcc 12.2 and libasound 1.2.8) with
        # no sequencer to run them on, so a green arm64 leg is not proof for
        # the device.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev libportmidi-dev libasound2-dev

      - name: Toolchain versions
        run: |
          gcc --version | head -n 1
          dpkg-query -W gcc binutils libncurses-dev libportmidi-dev libasound2-dev

      # ASan can fail to start when vm.mmap_rnd_bits is above 28 (recent
      # Ubuntu kernels default to 32). The x64 image sets 28 in runner-images'
      # configure-environment.sh; setting it here keeps the sanitized runs
      # working on any image that does not.
      - name: Set vm.mmap_rnd_bits=28 for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # Fails if tool stops passing CFLAGS_EXTRA to the compiler, which would
      # turn every -Werror step below into a silent no-op. The compiler error
      # this step prints is the expected outcome.
      - name: Check that CFLAGS_EXTRA reaches the compiler
        run: |
          if CFLAGS_EXTRA=-fborca-no-such-flag ./tool build cli; then
            echo "tool ignored CFLAGS_EXTRA"
            exit 1
          fi

      # The cli builds and their suites run before the orca builds, so a
      # warning that only the TUI triggers cannot hide the golden results.
      - name: Build debug cli
        run: CFLAGS_EXTRA=-Werror ./tool build -d cli

      # tool only warns when it cannot detect the compiler, and then builds
      # the debug cli without sanitizers, which the golden suite would not
      # notice. Fails unless the binary imports ASan and UBSan.
      - name: Check that the debug cli is sanitized
        run: tests/check-debug-build.sh build/debug/cli

      # The check's failure path: a program built with plain cc, unsanitized
      # and not stripped, must fail it, naming both sanitizers.
      - name: Debug-build check rejects an unsanitized binary
        run: |
          prog="$RUNNER_TEMP/unsanitized"
          log="$RUNNER_TEMP/unsanitized_check.log"
          printf 'int main(void) { return 0; }\n' >"$prog.c"
          cc -O0 "$prog.c" -o "$prog"
          status=0
          tests/check-debug-build.sh "$prog" >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" != 1 ]; then
            echo "expected exit 1 from the unsanitized binary, got $status"
            exit 1
          fi
          for want in __asan_init __ubsan_handle_; do
            if ! grep -q "$want" "$log"; then
              echo "the check did not name $want"
              exit 1
            fi
          done

      - name: Build release cli
        run: CFLAGS_EXTRA=-Werror ./tool build cli

      - name: Golden suite on the debug cli (ASan + UBSan)
        run: tests/run.sh build/debug/cli

      - name: Golden suite on the release cli
        run: tests/run.sh build/cli

      # tests/run.sh's bad-marker path: a throwaway pitch_bend.xfail that is
      # not exactly one item id must fail the case, and --update must leave
      # pitch_bend.events alone. The events file is edited first, so a
      # rewrite would show; the tree is restored and must end clean.
      - name: Golden suite rejects a bad marker
        run: |
          marker=tests/expected/patches/pitch_bend.xfail
          events=tests/expected/patches/pitch_bend.events
          log="$RUNNER_TEMP/bad_marker.log"
          for bad in 'TODO' 'B2 B5'; do
            printf '%s\n' "$bad" >"$marker"
            status=0
            tests/run.sh build/cli pitch_bend >"$log" 2>&1 || status=$?
            cat "$log"
            if [ "$status" != 1 ] || ! grep -q 'bad marker' "$log"; then
              echo "marker '$bad': expected exit 1 with a bad marker, got $status"
              exit 1
            fi
            echo "edited by CI" >>"$events"
            cp "$events" "$RUNNER_TEMP/pitch_bend.events.edited"
            status=0
            tests/run.sh --update build/cli pitch_bend >"$log" 2>&1 || status=$?
            cat "$log"
            if [ "$status" != 1 ] ||
              ! cmp -s "$events" "$RUNNER_TEMP/pitch_bend.events.edited"; then
              echo "marker '$bad': --update must exit 1 and leave $events alone"
              exit 1
            fi
            git checkout -- "$events"
            rm "$marker"
          done
          git diff --exit-code
          test -z "$(git status --porcelain)"

      # B7's non-empty rule: every example outside examples/upstream/ sends an
      # event or changes its grid in 64 ticks, or is one of the exceptions
      # the script names; a crash or sanitizer report fails it.
      - name: Every example does something (debug cli)
        run: tests/check-examples.sh build/debug/cli

      # The examples check's failure path: a throwaway dots-only example,
      # which neither sends nor changes its grid, must fail it, naming the
      # file. The file is removed and the tree must end clean. It uses the
      # release cli, as the bad-marker step does, to keep the job short.
      - name: Examples check rejects an example that does nothing (canary)
        run: |
          canary=examples/ci-canary.orca
          log="$RUNNER_TEMP/examples_canary.log"
          printf '.....\n.....\n' >"$canary"
          status=0
          tests/check-examples.sh build/cli >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" != 1 ] || ! grep -q "^FAIL   $canary " "$log"; then
            echo "expected exit 1 with a FAIL line for $canary, got $status"
            exit 1
          fi
          rm "$canary"
          test -z "$(git status --porcelain)"

      # The shared crash rule's failure path (tests/lib.sh). A fake cli runs
      # the release cli for every file but tests/patches/pitch_bend.orca and
      # examples/basics/_midi.orca. For those, by MODE, it prints a UBSan
      # "runtime error:" line and exits 0 (san); sleeps 5 s under a timeout
      # shim on PATH that runs the real timeout with 1 s, so the command -v
      # timeout path is the one tested (slow); or exits 3 after the real
      # output (exit3). tests/run.sh and tests/check-examples.sh must each
      # exit 1 with the exact FAIL line for san and slow (and, for san, the
      # report excerpt and summary line). For exit3, check-examples.sh must
      # fail the file, and run.sh, under a throwaway pitch_bend.xfail
      # holding B2, must report XFAIL and exit 0: only check-examples.sh
      # fails a plain non-zero exit. The tree must end clean.
      - name: Golden and examples checks catch a planted crash (canary)
        run: |
          fake="$RUNNER_TEMP/cli-planted"
          shim="$RUNNER_TEMP/timeout-shim"
          log="$RUNNER_TEMP/planted_crash.log"
          marker=tests/expected/patches/pitch_bend.xfail
          mkdir -p "$shim"
          printf '#!/bin/sh\nshift\nexec "%s" 1 "$@"\n' \
            "$(command -v timeout)" >"$shim/timeout"
          printf '%s\n' '#!/bin/sh' \
            'case "$*" in *basics/_midi.orca*|*pitch_bend.orca*)' \
            '  case $MODE in' \
            '    san) "$REAL_CLI" "$@"; echo "x.c:1:2: runtime error: planted" >&2; exit 0 ;;' \
            '    slow) sleep 5 ;;' \
            '    exit3) "$REAL_CLI" "$@"; exit 3 ;;' \
            '  esac ;;' \
            'esac' \
            'exec "$REAL_CLI" "$@"' >"$fake"
          chmod +x "$shim/timeout" "$fake"
          export REAL_CLI="$PWD/build/cli"
          # run_check <MODE> <PATH> <want status> <script> <args...>
          run_check() {
            mode=$1 path=$2 want=$3
            shift 3
            status=0
            MODE=$mode PATH=$path "$@" >"$log" 2>&1 || status=$?
            cat "$log"
            if [ "$status" != "$want" ]; then
              echo "$mode: expected exit $want from $1, got $status"
              exit 1
            fi
          }
          # need <line>...: each line must be in the log, exactly.
          need() {
            for line in "$@"; do
              if ! grep -qxF -- "$line" "$log"; then
                echo "$mode: expected the line '$line'"
                exit 1
              fi
            done
          }
          run_check san "$PATH" 1 tests/run.sh "$fake" pitch_bend
          need 'FAIL  tests/patches/pitch_bend.orca (sanitizer report)' \
            '      x.c:1:2: runtime error: planted' \
            '1 cases: 0 pass, 0 xfail, 1 fail, 0 xpass, 0 orphaned'
          run_check san "$PATH" 1 tests/check-examples.sh "$fake"
          need 'FAIL   examples/basics/_midi.orca (cli -t 0: sanitizer report)' \
            '       x.c:1:2: runtime error: planted'
          # Only the planted file fails; the counts follow the example set.
          if ! grep -Eqx 'examples check: [0-9]+ files, [0-9]+ pass, [0-9]+ exceptions, 1 fail' "$log"; then
            echo "san: expected the examples summary with exactly 1 fail"
            exit 1
          fi
          run_check slow "$shim:$PATH" 1 tests/run.sh "$fake" pitch_bend
          need 'FAIL  tests/patches/pitch_bend.orca (cli exited 124 (signal or timeout))'
          run_check slow "$shim:$PATH" 1 tests/check-examples.sh "$fake"
          need 'FAIL   examples/basics/_midi.orca (cli -t 0: cli exited 124 (signal or timeout))'
          run_check exit3 "$PATH" 1 tests/check-examples.sh "$fake"
          need 'FAIL   examples/basics/_midi.orca (cli -t 0: cli exited 3)'
          printf 'B2\n' >"$marker"
          run_check exit3 "$PATH" 0 tests/run.sh "$fake" pitch_bend
          need 'XFAIL tests/patches/pitch_bend.orca (waiting for B2)'
          rm "$marker"
          test -z "$(git status --porcelain)"

      # The upstream dialect against Orca-c 9df9786 itself (CAP-13, spine
      # AD-21). build-cli.sh builds Orca-c's cli with --events and --seed,
      # fetching the commit by URL, since the checkout is shallow. compare.sh
      # checks that the two events_print copies are one file, runs all 43
      # of Orca-c's examples through both cli for 96 ticks (bOrca's with
      # --dialect upstream) and fails on any byte difference or if fewer
      # than 43 ran, and checks that the upstream goldens and examples and
      # the six named exceptions are still Orca-c's.
      - name: Build Orca-c 9df9786's cli
        run: tests/upstream/build-cli.sh

      - name: Upstream dialect matches Orca-c on its 43 examples (debug cli)
        run: tests/upstream/compare.sh build/debug/cli

      - name: Upstream dialect matches Orca-c on its 43 examples (release cli)
        run: tests/upstream/compare.sh build/cli

      # The comparison's failure path: the release cli with --dialect borca
      # appended (a later flag wins) must fail it, naming _osc.orca.
      - name: Upstream comparison rejects bOrca's dialect (canary)
        run: |
          wrapper="$RUNNER_TEMP/cli-borca-dialect"
          log="$RUNNER_TEMP/upstream_canary.log"
          printf '#!/bin/sh\nexec "%s" "$@" --dialect borca\n' \
            "$PWD/build/cli" >"$wrapper"
          chmod +x "$wrapper"
          status=0
          tests/upstream/compare.sh "$wrapper" >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" != 1 ] ||
            ! grep -q '^FAIL  examples/basics/_osc.orca ' "$log"; then
            echo "expected exit 1 with a FAIL line for examples/basics/_osc.orca, got $status"
            exit 1
          fi

      # The golden and file checks' failure path: one upstream golden with a
      # byte appended must fail compare.sh, naming it. The golden is
      # restored and the tree must end clean.
      - name: Upstream comparison rejects a changed upstream golden (canary)
        run: |
          golden=tests/expected/examples/upstream/basics/_osc.events
          log="$RUNNER_TEMP/upstream_golden_canary.log"
          printf 'x' >>"$golden"
          status=0
          tests/upstream/compare.sh build/cli >"$log" 2>&1 || status=$?
          cat "$log"
          git checkout -- "$golden"
          if [ "$status" != 1 ] ||
            ! grep -q "^FAIL  $golden " "$log"; then
            echo "expected exit 1 with a FAIL line for $golden, got $status"
            exit 1
          fi
          test -z "$(git status --porcelain)"

      # The README's scale and chord tables, between its tables:begin and
      # tables:end markers, must be exactly what readme-gen prints from
      # music.h (spine AD-19).
      - name: Build readme-gen
        run: CFLAGS_EXTRA=-Werror ./tool build readme-gen

      - name: README tables match readme-gen (doc-sync)
        run: tests/check-doc-sync.sh build/readme-gen

      # doc-sync's failure paths: a README copy with one table cell changed
      # (the K row's root notes) must fail it, printing that row, and a copy
      # with the end marker deleted must fail it as bad markers.
      - name: Doc-sync rejects a changed table cell and a missing marker (canary)
        run: |
          copy="$RUNNER_TEMP/README.md"
          log="$RUNNER_TEMP/doc_sync_canary.log"
          sed 's/^|   k\/K   | Major9 | C-E-G-B-D |/|   k\/K   | Major9 | C-E-G-B-Db |/' README.md >"$copy"
          if cmp -s README.md "$copy"; then
            echo "the canary's sed changed nothing in the README copy"
            exit 1
          fi
          status=0
          tests/check-doc-sync.sh build/readme-gen "$copy" >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" != 1 ]; then
            echo "expected exit 1 from doc-sync on the changed copy, got $status"
            exit 1
          fi
          if ! grep -qF -e '-|   k/K   | Major9 | C-E-G-B-Db |' "$log"; then
            echo "doc-sync did not print the changed row"
            exit 1
          fi
          sed '/<!-- tables:end -->/d' README.md >"$copy"
          if grep -qF '<!-- tables:end -->' "$copy"; then
            echo "the canary's sed left the end marker in the README copy"
            exit 1
          fi
          status=0
          tests/check-doc-sync.sh build/readme-gen "$copy" >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" != 1 ] || ! grep -q 'FAIL  doc-sync: bad markers' "$log"; then
            echo "expected exit 1 with bad markers from the copy without an end marker, got $status"
            exit 1
          fi

      # AD-2 and AD-1 over every file in ./tool sources core; the expected
      # failures are listed in tests/xfail/. They need no build, so they run
      # before the unit-test builds and a failing build cannot hide them.
      - name: Core include allow-list check (with canary)
        run: tests/check-includes.sh

      - name: Core no-writable-globals check (nm, with canary)
        run: tests/check-nm.sh

      # The unit-test runner, in debug (ASan + UBSan). The runner makes UBSan
      # halt at its first report, and the run steps also set halt_on_error,
      # as tests/run.sh does for the goldens. The --portmidi and --alsa
      # builds add their adapter tests and fail if they register none; they
      # write the same build/debug/unit_tests, so each build is run, and
      # checked, before the next one replaces it. After each run,
      # tests/check-debug-build.sh fails unless the runner imports ASan and
      # UBSan and its "<n> tests" count equals the T test_* functions it
      # defines, so a test that no list registers cannot sit unrun. The
      # first run also fails unless the realloc-hook test ran, so a tool
      # that lost the hook's flags on Linux cannot drop it silently.
      - name: Build debug unit tests
        run: CFLAGS_EXTRA=-Werror ./tool build -d test

      - name: Unit tests (ASan + UBSan)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          log="$RUNNER_TEMP/unit_tests.log"
          status=0
          build/debug/unit_tests >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" != 0 ]; then
            echo "unit_tests exited $status"
            exit 1
          fi
          if ! grep -qx 'ok tick_note_alloc_fail' "$log"; then
            echo "the realloc-hook test did not run"
            exit 1
          fi
          if ! grep -qx 'ok realloc_hook_builtin_null' "$log"; then
            echo "the realloc hook missed a provably-NULL realloc: tool lost -fno-builtin-realloc"
            exit 1
          fi
          tests/check-debug-build.sh build/debug/unit_tests "$log"

      # The check's count path: with -DUNIT_TESTS_UNREGISTERED_CANARY the
      # runner defines test_unregistered_canary, which has its own prototype
      # and is in no list, so it never runs and the check must name it. The
      # next step rebuilds build/debug/unit_tests.
      - name: Debug-build check names an unregistered test (canary)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          CFLAGS_EXTRA="-Werror -DUNIT_TESTS_UNREGISTERED_CANARY" ./tool build -d test
          log="$RUNNER_TEMP/unit_tests_unregistered.log"
          check="$RUNNER_TEMP/unit_tests_unregistered_check.log"
          build/debug/unit_tests >"$log" 2>&1
          cat "$log"
          status=0
          tests/check-debug-build.sh build/debug/unit_tests "$log" >"$check" 2>&1 || status=$?
          cat "$check"
          if [ "$status" != 1 ]; then
            echo "expected exit 1 from the unregistered canary, got $status"
            exit 1
          fi
          if ! grep -q 'never run: test_unregistered_canary' "$check"; then
            echo "the check did not name test_unregistered_canary"
            exit 1
          fi

      - name: Build debug unit tests with PortMidi
        run: CFLAGS_EXTRA=-Werror ./tool build -d --portmidi test

      # Fails unless the PortMidi adapter test actually ran, so a build in
      # which FEAT_PORTMIDI never reaches the compiler cannot pass.
      - name: Unit tests with the PortMidi adapter tests (ASan + UBSan)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          log="$RUNNER_TEMP/unit_tests_portmidi.log"
          status=0
          build/debug/unit_tests >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" != 0 ]; then
            echo "unit_tests exited $status"
            exit 1
          fi
          if ! grep -qx 'ok portmidi_error_text_and_filters' "$log"; then
            echo "the PortMidi adapter test did not run"
            exit 1
          fi
          tests/check-debug-build.sh build/debug/unit_tests "$log"

      - name: Build debug unit tests with ALSA
        run: CFLAGS_EXTRA=-Werror ./tool build -d --alsa test

      # Fails unless the ALSA adapter test actually ran, so a build in which
      # FEAT_ALSA never reaches the compiler cannot pass. The test needs no
      # sequencer device.
      - name: Unit tests with the ALSA adapter tests (ASan + UBSan)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          log="$RUNNER_TEMP/unit_tests_alsa.log"
          status=0
          build/debug/unit_tests >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" != 0 ]; then
            echo "unit_tests exited $status"
            exit 1
          fi
          if ! grep -qx 'ok alsa_version_and_open_modes' "$log"; then
            echo "the ALSA adapter test did not run"
            exit 1
          fi
          tests/check-debug-build.sh build/debug/unit_tests "$log"

      # A build has at most one hardware MIDI backend (spine AD-17). The
      # error this step prints is the expected outcome.
      - name: Check that --alsa and --portmidi exclude each other
        run: |
          log="$RUNNER_TEMP/alsa_portmidi.log"
          if ./tool build --alsa --portmidi orca >"$log" 2>&1; then
            cat "$log"
            echo "tool accepted --alsa with --portmidi"
            exit 1
          fi
          cat "$log"
          if ! grep -q 'Choose ALSA or PortMidi' "$log"; then
            echo "tool did not say why it refused --alsa with --portmidi"
            exit 1
          fi

      - name: Build debug orca
        run: CFLAGS_EXTRA=-Werror ./tool build -d orca

      - name: Build debug orca with PortMidi (make debug)
        run: CFLAGS_EXTRA=-Werror ./tool build -d --portmidi orca

      - name: Build debug orca with ALSA
        run: CFLAGS_EXTRA=-Werror ./tool build -d --alsa orca

      # Release builds link with -flto, and gcc may print "lto-wrapper:
      # warning: using serial compilation of N LTRANS jobs". That line is a
      # note from the link step, not a compiler diagnostic, and -Werror does
      # not turn it into an error.
      - name: Build release orca without mouse support
        run: CFLAGS_EXTRA=-Werror ./tool build --no-mouse orca

      - name: Build release orca with PortMidi
        run: CFLAGS_EXTRA=-Werror ./tool build --portmidi orca

      # The debug-counter builds compile the wakeup counter (both) and the
      # ALSA drop counters (--alsa), with their stderr lines. They write
      # build/orca, so they run before the plain --alsa build, whose binary
      # the next step checks. After each counter build, grep -a must find
      # its counter strings in the -flto -s binary; after the plain --alsa
      # build and make appliance below, it must find neither, which proves
      # that the counters stay out of the shipped builds. The positive greps
      # are the canary for the negative ones. BORCA_DEBUG_COUNTERS also
      # gates the MIDI-in counter line; the wakeup line catches its leak.
      - name: Build release orca with debug counters
        run: CFLAGS_EXTRA="-Werror -DBORCA_DEBUG_COUNTERS" ./tool build orca

      - name: Check that the counter orca holds the wakeup counter string
        run: |
          if ! grep -aq 'bOrca wakeups:' build/orca; then
            echo "build/orca does not hold 'bOrca wakeups:': the counter build lost its counter"
            exit 1
          fi

      - name: Build release orca with ALSA and debug counters
        run: CFLAGS_EXTRA="-Werror -DBORCA_DEBUG_COUNTERS" ./tool build --alsa orca

      - name: Check that the ALSA counter orca holds both counter strings
        run: |
          if ! grep -aq 'bOrca wakeups:' build/orca; then
            echo "build/orca does not hold 'bOrca wakeups:': the counter build lost its counter"
            exit 1
          fi
          if ! grep -aq 'bOrca ALSA:' build/orca; then
            echo "build/orca does not hold 'bOrca ALSA:': the counter build lost its ALSA counters"
            exit 1
          fi

      - name: Build release orca with ALSA
        run: CFLAGS_EXTRA=-Werror ./tool build --alsa orca

      - name: Check that the ALSA orca holds no counter string
        run: |
          if grep -aq 'bOrca wakeups:' build/orca; then
            echo "build/orca holds 'bOrca wakeups:': the debug counters leaked into a release build"
            exit 1
          fi
          if grep -aq 'bOrca ALSA:' build/orca; then
            echo "build/orca holds 'bOrca ALSA:': the debug counters leaked into a release build"
            exit 1
          fi

      # Fails if --alsa stops reaching the link, which a green build alone
      # would not show.
      - name: Check that the ALSA orca links libasound
        run: |
          dyn="$RUNNER_TEMP/orca_alsa_dynamic.txt"
          readelf -d build/orca >"$dyn"
          grep NEEDED "$dyn"
          if ! grep -q 'NEEDED.*\[libasound\.so\.2\]' "$dyn"; then
            echo "build/orca does not link libasound.so.2"
            exit 1
          fi

      # The uConsole appliance build: --alsa --harden --pie. make passes
      # CFLAGS_EXTRA to tool through the environment. Ubuntu's gcc predefines
      # _FORTIFY_SOURCE, so this step also checks that --harden undefines it
      # before redefining it.
      - name: Build the appliance orca (make appliance)
        run: CFLAGS_EXTRA=-Werror make appliance

      - name: Check that the appliance orca holds no counter string
        run: |
          if grep -aq 'bOrca wakeups:' build/orca; then
            echo "build/orca holds 'bOrca wakeups:': the debug counters leaked into the appliance build"
            exit 1
          fi
          if grep -aq 'bOrca ALSA:' build/orca; then
            echo "build/orca holds 'bOrca ALSA:': the debug counters leaked into the appliance build"
            exit 1
          fi

      # Fails unless make appliance kept all three of --alsa (libasound),
      # --pie (an ELF of type DYN) and --harden (the stack protector's
      # __stack_chk_fail).
      - name: Check that the appliance orca is ALSA, PIE and hardened
        run: |
          dyn="$RUNNER_TEMP/orca_appliance_dynamic.txt"
          hdr="$RUNNER_TEMP/orca_appliance_header.txt"
          und="$RUNNER_TEMP/orca_appliance_undefined.txt"
          readelf -d build/orca >"$dyn"
          readelf -h build/orca >"$hdr"
          nm -D --undefined-only build/orca >"$und"
          grep NEEDED "$dyn"
          grep 'Type:' "$hdr"
          status=0
          if ! grep -q 'NEEDED.*\[libasound\.so\.2\]' "$dyn"; then
            echo "build/orca does not link libasound.so.2"
            status=1
          fi
          if ! grep -Eq '^[[:space:]]*Type:[[:space:]]+DYN' "$hdr"; then
            echo "build/orca is not a PIE (ELF type DYN)"
            status=1
          fi
          if ! grep -Eq '[[:space:]]__stack_chk_fail(@|$)' "$und"; then
            echo "build/orca does not reference __stack_chk_fail"
            status=1
          fi
          exit "$status"

      # orca takes --dialect borca or upstream only; any other value exits 1
      # with its error on stderr, before curses starts and before the ALSA
      # client opens (CAP-13).
      - name: orca rejects a bad --dialect value
        run: |
          err="$RUNNER_TEMP/orca_bad_dialect.err"
          status=0
          build/orca --dialect foo </dev/null >/dev/null 2>"$err" || status=$?
          cat "$err"
          if [ "$status" != 1 ]; then
            echo "expected exit 1 from orca --dialect foo, got $status"
            exit 1
          fi
          if ! grep -q '^Bad dialect argument: foo$' "$err" ||
            ! grep -q '^Must be borca or upstream\.$' "$err"; then
            echo "orca did not report the bad --dialect value"
            exit 1
          fi

  # The goldens were captured on arm64, where gcc treats plain char as
  # unsigned; the x86_64 build leg above checks signed char against them.
  # This job checks the release cli built with unsigned char on x86_64.
  unsigned-char:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build release cli with -funsigned-char
        run: CFLAGS_EXTRA="-Werror -funsigned-char" ./tool build cli

      - name: Golden suite against the committed goldens
        run: tests/run.sh build/cli

      - name: Build release unit tests with -funsigned-char
        run: CFLAGS_EXTRA="-Werror -funsigned-char" ./tool build test

      # The release runner is an -flto -s link. Without tool's
      # -fno-builtin-realloc, any optimised build (-Og debug or -O2 -flto
      # release) may fold a realloc whose pointer the compiler proves NULL
      # into malloc, past the wrap; realloc_hook_builtin_null proves the flag
      # is present. The step fails unless both hook tests ran and passed.
      - name: Unit tests (release, unsigned char)
        run: |
          log="$RUNNER_TEMP/unit_tests_release.log"
          status=0
          build/unit_tests >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" != 0 ]; then
            echo "unit_tests exited $status"
            exit 1
          fi
          if ! grep -qx 'ok tick_note_alloc_fail' "$log"; then
            echo "the realloc-hook test did not run in the -flto -s link"
            exit 1
          fi
          if ! grep -qx 'ok realloc_hook_builtin_null' "$log"; then
            echo "the realloc hook missed a provably-NULL realloc: tool lost -fno-builtin-realloc"
            exit 1
          fi

      # The runner's failure path: with -DUNIT_TESTS_CANARY it registers a
      # test whose check is false, and must report it and exit 1.
      - name: Unit-test runner reports a failed check (canary)
        run: |
          CFLAGS_EXTRA="-Werror -DUNIT_TESTS_CANARY" ./tool build test
          log="$RUNNER_TEMP/unit_tests_canary.log"
          status=0
          build/unit_tests >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" != 1 ]; then
            echo "expected exit 1 from the canary build, got $status"
            exit 1
          fi
          if ! grep -q '^FAIL unit_check_canary:' "$log"; then
            echo "the runner did not report the canary's failed check"
            exit 1
          fi

      # ubuntu-24.04 ships shellcheck (0.9.0); the arm image is not known to.
      - name: Shellcheck the build and test scripts
        run: >-
          shellcheck -s sh tool tests/run.sh tests/check-includes.sh
          tests/check-nm.sh tests/check-debug-build.sh tests/check-doc-sync.sh
          tests/check-examples.sh tests/lib.sh tests/upstream/build-cli.sh
          tests/upstream/compare.sh tests/wakeups/ab.sh

  # The debug cli and the unit runner under clang's UBSan, whose
  # pointer-overflow check reports NULL + 0 where gcc's does not, so the
  # empty-list guard in tick_release_all is machine-checked (deferred-work
  # #19). tool honours $CC, and CFLAGS_EXTRA lands after tool's own
  # sanitizer flags, so it turns off clang's implicit-conversion and
  # unsigned-integer-overflow checks: unsigned wrap is defined C, which
  # prng.h's PCG32 relies on, and neither check is about UB. No -Werror:
  # the gcc legs own it, and a clang warning is a ledger entry for Ian, not
  # a flag. check-nm.sh and check-includes.sh call gcc by name, so the gcc
  # legs own them too, with the examples, doc-sync, upstream and shellcheck
  # steps. The last step proves the leg can fail: in a copy of the tree
  # with the guard deleted, the runner must abort on NULL + 0.
  clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CFLAGS_EXTRA: -fsanitize=undefined,pointer-overflow -fno-sanitize=implicit-conversion,unsigned-integer-overflow
    steps:
      - uses: actions/checkout@v7

      - name: Install clang if the image lacks it
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y clang
          fi

      - name: Toolchain versions
        run: clang --version | head -n 1

      - name: Set vm.mmap_rnd_bits=28 for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # Each clang build keeps its output for the warnings step below.
      - name: Build debug cli
        run: |
          set -o pipefail
          ./tool build -d cli 2>&1 | tee "$RUNNER_TEMP/clang_build_cli.log"

      - name: Check that the debug cli is sanitized
        run: tests/check-debug-build.sh build/debug/cli

      - name: Golden suite on the debug cli (ASan + UBSan with pointer-overflow)
        run: tests/run.sh build/debug/cli

      - name: Build debug unit tests
        run: |
          set -o pipefail
          ./tool build -d test 2>&1 | tee "$RUNNER_TEMP/clang_build_test.log"

      # No -Werror on this job, so its warnings would scroll by unseen: this
      # step prints each one as an annotation, with a count, and never fails.
      # A clang warning is a ledger entry for Ian, not a flag or a fix.
      - name: Report clang warnings (non-fatal)
        if: always()
        run: |
          warnings="$RUNNER_TEMP/clang_warnings.txt"
          : >"$warnings"
          for f in "$RUNNER_TEMP/clang_build_cli.log" "$RUNNER_TEMP/clang_build_test.log"; do
            if [ -f "$f" ]; then
              grep 'warning:' "$f" >>"$warnings" || true
            fi
          done
          while IFS= read -r line; do
            printf '::warning::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g')"
          done <"$warnings"
          echo "clang warnings: $(wc -l <"$warnings")"

      - name: Unit tests (ASan + UBSan with pointer-overflow)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          log="$RUNNER_TEMP/unit_tests_clang.log"
          status=0
          build/debug/unit_tests >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" != 0 ]; then
            echo "unit_tests exited $status"
            exit 1
          fi
          if ! grep -qx 'ok tick_note_alloc_fail' "$log"; then
            echo "the realloc-hook test did not run"
            exit 1
          fi
          tests/check-debug-build.sh build/debug/unit_tests "$log"

      # The guard canary: a copy of HEAD with tick_release_all's two-line
      # count == 0 guard deleted (its return line is the only line of
      # tick.c that carries "NULL + 0 is undefined"), built the same way,
      # must exit non-zero with UBSan's report of the NULL + 0 that
      # test_tick_note_empty_list then forms. Each gate is its own command:
      # the Actions shell never fails a step on a ! command or on a command
      # before the last &&.
      - name: Deleting tick_release_all's empty-list guard fails the runner (canary)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          red="$RUNNER_TEMP/red"
          mkdir -p "$red"
          git archive HEAD | tar -x -C "$red"
          before=$(wc -l <"$red/tick.c")
          sed -i '/if (susnotes->count == 0)$/{N;/NULL + 0 is undefined/d}' "$red/tick.c"
          after=$(wc -l <"$red/tick.c")
          if [ $((before - after)) != 2 ]; then
            echo "expected the guard's two lines to go from tick.c, $((before - after)) went"
            exit 1
          fi
          (cd "$red" && ./tool build -d test)
          log="$RUNNER_TEMP/red.log"
          status=0
          "$red/build/debug/unit_tests" >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" = 0 ]; then
            echo "the runner exited 0 with the guard deleted"
            exit 1
          fi
          if ! grep -q 'applying zero offset to null pointer' "$log"; then
            echo "the runner did not report NULL + 0"
            exit 1
          fi

  # 32-bit ARM (Pi Zero 2W), where Usz is 32-bit: the one job that runs the
  # unit tests at that width (P3-6, deferred-work #14). prng.h promises that
  # a 32-bit Usz gives the PRNG lowercase r draws from the same sequence as
  # a 64-bit one (spine AD-8), and test_prng_seed_fixed_vectors pins
  # prng_seed's first outputs, so the job builds the release unit runner
  # statically with arm-linux-gnueabihf-gcc through tool, checks with
  # readelf that it is a static 32-bit ARM binary, and runs it under
  # qemu-arm-static. It runs on the arm64 image, where uname -m is aarch64,
  # so tool adds no -march (on an x86_64 host it would hand -march=nehalem
  # to the arm compiler) and every flag tool gives the test target, its
  # realloc hook's included, reaches the armhf runner.
  # Release, not debug: ASan does not run under qemu-user. The job never
  # builds or runs cli, so the R and ; pattern c goldens, which assume a
  # 64-bit Usz, stay out of it. The job is required: a red result fails
  # the run (optional before P3-6's first green run).
  #
  # The compile step checks each source's portability, cli and readme-gen
  # included, one file at a time. It calls the cross compiler directly, with
  # the warning flags copied by hand from tool's build_target (the "add
  # cc_flags -std=c99 ..." lines), plus its release -O2 -DNDEBUG and
  # -Werror, which must be kept in sync with it. It ignores CFLAGS_EXTRA and
  # leaves out the rest of tool's release flags (-g0, the fortify and
  # stack-protector overrides, -no-pie), and Ubuntu's cross gcc enables some
  # hardening by default, so it does not reproduce the release build; the
  # runner build after it does.
  armhf:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # No --no-install-recommends: libc6-dev-armhf-cross, which holds the
      # static libc the runner links, is only a Recommends.
      - name: Install the armhf cross compiler and qemu-user-static
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user-static

      - name: Toolchain versions
        run: |
          arm-linux-gnueabihf-gcc --version | head -n 1
          qemu-arm-static --version | head -n 1

      # The files are the union of tool's cli, test and readme-gen source
      # lists, so they follow the shared CORE list. The lists are read before
      # the loop, so a failing ./tool sources fails the step instead of
      # compiling nothing. Every file is compiled even after a failure, so one
      # run reports them all.
      - name: Compile each source for armhf
        run: |
          cli_files=$(./tool sources cli)
          test_files=$(./tool sources test)
          readme_gen_files=$(./tool sources readme-gen)
          files=$(printf '%s\n' "$cli_files" "$test_files" "$readme_gen_files" | awk 'NF && !seen[$0]++')
          test -n "$files"
          status=0
          for f in $files; do
            echo "arm-linux-gnueabihf-gcc -c $f"
            arm-linux-gnueabihf-gcc -std=c99 -pipe -finput-charset=UTF-8 \
              -Wall -Wpedantic -Wextra -Wwrite-strings -Wconversion -Wshadow \
              -Wstrict-prototypes -Werror=implicit-function-declaration \
              -Werror=implicit-int -Werror=incompatible-pointer-types \
              -Werror=int-conversion -O2 -DNDEBUG -Werror \
              -c "$f" -o /dev/null || status=1
          done
          exit "$status"

      # The release runner, statically linked, so qemu-arm-static needs no
      # armhf sysroot. tool detects the cross gcc through -E and gives it the
      # test target's full release flags (-O2 -DNDEBUG -flto -s -no-pie, the
      # realloc hook's -Wl,--wrap=realloc) plus -static. If the cross LTO
      # link ever fails, CFLAGS_EXTRA="-Werror -fno-lto" is the fallback. -v
      # prints the compiler line.
      - name: Build the release unit runner for armhf
        run: CC=arm-linux-gnueabihf-gcc CFLAGS_EXTRA=-Werror ./tool build -v --static test

      # Fails unless build/unit_tests is a 32-bit ARM ELF with no NEEDED
      # entry, so a runner linked by the host's cc (ELF64, AArch64), which
      # is what tool builds when CC is unset, or a dynamic one, stops here
      # before the qemu run.
      - name: The runner is a static 32-bit ARM binary
        run: |
          hdr="$RUNNER_TEMP/unit_tests_armhf_header.txt"
          dyn="$RUNNER_TEMP/unit_tests_armhf_dynamic.txt"
          readelf -h build/unit_tests >"$hdr"
          readelf -d build/unit_tests >"$dyn"
          grep -E 'Class:|Machine:' "$hdr"
          cat "$dyn"
          status=0
          if ! grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF32[[:space:]]*$' "$hdr"; then
            echo "build/unit_tests is not ELF32"
            status=1
          fi
          if ! grep -Eq '^[[:space:]]*Machine:[[:space:]]+ARM[[:space:]]*$' "$hdr"; then
            echo "build/unit_tests is not an ARM binary"
            status=1
          fi
          if grep -q NEEDED "$dyn"; then
            echo "build/unit_tests has a NEEDED entry: it is not static"
            status=1
          fi
          exit "$status"

      # Fails unless the runner exits 0 under qemu and its log holds
      # ok prng_seed_fixed_vectors, so the fixed vectors are proven to have
      # run on this binary at a 32-bit Usz; a mismatch prints the observed
      # values before its FAIL line. It also fails unless the realloc-hook
      # test ran, as in the other jobs, so the hook's 32-bit -Werror build
      # and its static --wrap link are proven here too, and unless the log
      # ends with "<n> tests, 0 failed". A hung run stops after 300 s.
      - name: Unit tests under qemu
        run: |
          log="$RUNNER_TEMP/unit_tests_armhf.log"
          status=0
          timeout 300 qemu-arm-static build/unit_tests >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" = 124 ]; then
            echo "unit_tests timed out after 300 s under qemu-arm-static"
            exit 1
          fi
          if [ "$status" != 0 ]; then
            echo "unit_tests exited $status under qemu-arm-static"
            exit 1
          fi
          if ! grep -Ex '[0-9]+ tests, 0 failed' "$log"; then
            echo "the log has no \"<n> tests, 0 failed\" line"
            exit 1
          fi
          if ! grep -qx 'ok prng_seed_fixed_vectors' "$log"; then
            echo "the fixed-vector test did not run"
            exit 1
          fi
          if ! grep -qx 'ok tick_note_alloc_fail' "$log"; then
            echo "the realloc-hook test did not run in the static armhf link"
            exit 1
          fi
